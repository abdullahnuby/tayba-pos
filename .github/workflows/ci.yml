name: Local POS quality checks

on:
  push:
    branches:
      - local-only-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_SECRET: ci-only-do-not-use-in-production
      DATABASE_URL: file:../data/tayba.db
      NODE_ENV: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Prepare empty test database
        run: npm run db:setup
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
